$kind: http-request
description: "Ruta /api/publico/** declarada con permitAll(): no requiere autenticación."
url: "{{baseUrl}}/api/publico/saludo"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
