$kind: http-request
description: ADMIN elimina la categoría creada en C7 (204).
url: "{{baseUrl}}/api/categorias/{{categoriaCreada}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 9000
