$kind: http-request
description: "ADMIN con datos válidos: se actualiza (200)."
url: "{{baseUrl}}/api/categorias/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Granos básicos",
      "descripcion": "Arroz, frijoles y maíz (actualizada)"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
