$kind: http-request
description: "ADMIN puede modificar productos y el cuerpo es válido: se crea el recurso (201)."
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Aceite 1 L",
      "precio": 62.50,
      "stock": 40,
      "categoriaId": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 5000
