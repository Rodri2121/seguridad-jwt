$kind: http-request
description: "Token válido (autenticado) pero el rol USER no tiene permiso de escritura: autorización denegada (403)."
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Aceite 1 L",
      "precio": 62.50,
      "stock": 40,
      "categoriaId": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenUser}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
