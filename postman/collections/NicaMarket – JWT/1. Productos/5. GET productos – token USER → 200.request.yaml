$kind: http-request
description: GET /api/productos/** permite hasAnyRole(USER, ADMIN).
url: "{{baseUrl}}/api/productos"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenUser}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
