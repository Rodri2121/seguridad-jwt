$kind: http-request
description: "Sin encabezado Authorization no hay identidad: falla la autenticación (401)."
url: "{{baseUrl}}/api/productos"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Código 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
