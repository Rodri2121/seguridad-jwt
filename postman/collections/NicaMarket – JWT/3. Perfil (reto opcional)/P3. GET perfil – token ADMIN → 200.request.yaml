$kind: http-request
description: Devuelve el subject y el claim roles del JWT.
url: "{{baseUrl}}/api/auth/perfil"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Rol ADMIN", () => pm.expect(pm.response.json().roles).to.include("ADMIN"));
    language: text/javascript
order: 3000
